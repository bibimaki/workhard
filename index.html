<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felinlove ♡ 4 Months</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Sriracha&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="deco"></div>

<!-- หน้าเปิด -->
<section id="intro">
  <div class="gift" id="gift"><i class="lid"></i><i class="bx"></i><i class="rb"></i></div>
  <h1 id="iTitle"></h1><p id="iSub"></p>
  <button class="btn big" id="openBtn"></button>
</section>

<!-- หน้าหลัก -->
<main id="main" hidden>
  <header>
    <div class="mascot" id="mascot">🧸</div>
    <h2 id="mTitle" class="script"></h2><p id="mSub"></p>
    <div class="menu" id="menu"></div>
    <div class="prog"><div><b id="pfill"></b></div><small id="ptxt"></small></div>
  </header>
  <section class="tl-wrap"><h3 class="script">Our 4 Months ♡</h3><div class="tl" id="tl"></div></section>
  <footer><small id="foot"></small></footer>
</main>

<button id="music" class="music" aria-label="เปิด/ปิดเพลง" hidden>🎵</button>
<audio id="audio" src="assets/music/song.mp3" loop preload="none"></audio>

<!-- Modal -->
<div id="modal" class="modal" hidden><div class="card" id="mcard"><button class="x" data-close aria-label="ปิด">✕</button><div id="mbody"></div></div></div>
<div id="lb" class="modal" hidden><div class="lbwrap"><button class="x" data-close aria-label="ปิด">✕</button><div id="lbbody"></div></div></div>
<div id="final" class="final" hidden><button class="x" data-close aria-label="ปิด">✕</button><div id="fbody"></div></div>
<div id="toast" class="toast"></div>

<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
